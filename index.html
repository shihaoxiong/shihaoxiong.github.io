<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f1e9" />
    <meta name="description" content="Shihao 的个人博客：记录构建、思考与长期主义。" />
    <title>Shihao Notes</title>
    <!-- Settle the theme before the first paint. Doing this in a React effect
         means one frame of light theme before dark takes over. -->
    <script>
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem("shihao-theme") === "dark" ? "dark" : "light";
      } catch (e) {
        document.documentElement.dataset.theme = "light";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
